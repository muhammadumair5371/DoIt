name: doit
description: "DoIt - Snap it. Do it. Done. AI Screenshot Task Auto-Creation App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Database
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # OCR & Media
  google_mlkit_text_recognition: ^0.14.0
  photo_manager: ^3.7.0

  # Networking & Cryptography
  dio: ^5.8.0+1
  crypto: ^3.0.3

  # Notifications & Timezone
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Permissions & System
  permission_handler: ^11.3.1
  workmanager: 0.9.2
  flutter_foreground_task: ^8.13.0

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Utilities
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  image: ^4.5.2
  intl: ^0.20.2
  uuid: ^4.5.1

dependency_overrides:
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2
  workmanager_apple: 0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/
